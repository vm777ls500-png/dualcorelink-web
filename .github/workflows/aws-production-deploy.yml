name: AWS static production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: aws-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy AWS static export
    runs-on:
      - self-hosted
      - linux
      - x64
      - dualcorelink-production
    timeout-minutes: 30

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Load validated build environment
        shell: bash
        run: |
          set -euo pipefail
          env_file=/srv/dualcorelink/frontend/shared/build.env
          test -r "$env_file"
          wordpress_rest_root="$(awk -F= '$1 == "WORDPRESS_REST_ROOT" { print substr($0, index($0, "=") + 1) }' "$env_file")"
          ga4_measurement_id="$(awk -F= '$1 == "NEXT_PUBLIC_GA4_MEASUREMENT_ID" { print substr($0, index($0, "=") + 1) }' "$env_file")"
          case "$wordpress_rest_root" in
            https://cms-aws.dualcorelink.com/wp-json|https://cms.dualcorelink.com/wp-json) ;;
            *) echo "Unexpected WORDPRESS_REST_ROOT" >&2; exit 1 ;;
          esac
          if [[ ! "$ga4_measurement_id" =~ ^G-[A-Z0-9]{6,20}$ ]]; then
            echo "Invalid NEXT_PUBLIC_GA4_MEASUREMENT_ID" >&2
            exit 1
          fi
          echo "::add-mask::$ga4_measurement_id"
          echo "WORDPRESS_REST_ROOT=$wordpress_rest_root" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GA4_MEASUREMENT_ID=$ga4_measurement_id" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate data
        run: npm run test:data

      - name: Validate inquiry infrastructure
        run: npm run test:inquiry-infra

      - name: Audit product media
        run: npm run media:audit

      - name: Enforce multilingual production release gate
        run: npm run multilingual:release-check -- --locale=zh --batch=p0

      - name: Build static export
        shell: bash
        run: |
          set -euo pipefail
          export NO_COLOR=1
          npm run build 2>&1 | tee build.log
          grep -Eq 'Generating static pages.*163/163' build.log

      - name: Deploy atomic release
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/scripts/deploy-static.sh \
            "$GITHUB_WORKSPACE/out" \
            "$GITHUB_SHA" \
            "https://aws.dualcorelink.com/en/"

      - name: Activate versioned Nginx site configuration
        id: nginx
        shell: bash
        run: |
          set -euo pipefail
          repository_helper="$GITHUB_WORKSPACE/deploy/scripts/activate-nginx-site-root.sh"
          installed_helper="/usr/local/sbin/dualcorelink-activate-nginx-site"
          test -f "$repository_helper"
          bash -n "$repository_helper"
          test -x "$installed_helper"
          installed_helper_metadata="$(stat -c '%U:%G %a' "$installed_helper")"
          if [[ "$installed_helper_metadata" != "root:root 755" ]]; then
            echo "Installed Nginx activation helper must be root:root mode 0755" >&2
            exit 1
          fi
          repository_helper_hash="$(sha256sum "$repository_helper" | awk '{print $1}')"
          installed_helper_hash="$(sha256sum "$installed_helper" | awk '{print $1}')"
          if [[ "$repository_helper_hash" != "$installed_helper_hash" ]]; then
            echo "Installed Nginx activation helper does not match the checked-out source" >&2
            exit 1
          fi
          sudo -n "$installed_helper" "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Verify exact production redirects
        shell: bash
        run: |
          set -euo pipefail

          verify_redirect() {
            local source_url="$1"
            local target_url="$2"
            local headers
            local status
            local location
            local final_result

            headers="$(curl --silent --show-error --dump-header - --output /dev/null --max-redirs 0 "$source_url")"
            status="$(awk '/^HTTP\// { code=$2 } END { print code }' <<< "$headers")"
            location="$(awk 'BEGIN { IGNORECASE=1 } /^Location:/ { sub(/\r$/, ""); print substr($0, 11) }' <<< "$headers" | tail -n 1)"

            if [[ "$status" != "301" || "$location" != "$target_url" ]]; then
              echo "Unexpected redirect: source=$source_url status=$status location=$location" >&2
              exit 1
            fi

            final_result="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code} %{url_effective} %{num_redirects}' \
              --location --max-redirs 1 "$source_url")"
            if [[ "$final_result" != "200 $target_url 1" ]]; then
              echo "Redirect target verification failed: source=$source_url result=$final_result" >&2
              exit 1
            fi

            echo "Redirect verified: $source_url -> $target_url"
          }

          verify_redirect \
            "https://dualcorelink.com/solutions/oem-odm-custom-panel-solution/" \
            "https://dualcorelink.com/en/solutions/oem-odm-custom-panel-solution/"
          verify_redirect \
            "https://dualcorelink.com/resources/hotel-rcu-wiring-system-architecture-guide/" \
            "https://dualcorelink.com/en/resources/hotel-rcu-wiring-system-architecture-guide/"

      - name: Verify test-domain indexing protection
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --head https://aws.dualcorelink.com/en/)"
          grep -Eiq '^x-robots-tag:.*noindex' <<< "$headers"
          curl --fail --silent --show-error https://aws.dualcorelink.com/sitemap.xml >/dev/null
